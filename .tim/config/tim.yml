# yaml-language-server: $schema=https://raw.githubusercontent.com/dimfeld/llmutils/main/schema/tim-config-schema.json

defaultExecutor: codex-cli
postApplyCommands:
  - title: Format code
    command: bun run format
    allowFailure: true
    hideOutputOnSuccess: true
developmentWorkflow: squash-rebase
quality: hobby
lifecycle:
  commands:
  - title: Install dependencies
    command: bun install
    mode: run
prCreation:
  draft: true
